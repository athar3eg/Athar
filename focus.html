<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مِدار — وضع التركيز</title>
<link rel="stylesheet" href="css/style.css?v=5">
<script src="js/supabase-js.min.js?v=5"></script>
</head>
<body>

<div class="focus-wrap">
  <button class="icon-btn" style="position:absolute; top:20px; right:20px" onclick="history.back()">✕</button>

  <div class="label" style="color:var(--text-soft); font-size:13px">🎯 وضع التركيز</div>

  <div class="timer-circle">
    <div class="time" id="timeDisplay">00:00</div>
    <div class="task-label" id="taskLabel">جاري التحميل...</div>
  </div>

  <div class="focus-controls">
    <button class="btn btn-ghost" id="pauseBtn" onclick="togglePause()">إيقاف مؤقت</button>
    <button class="btn btn-primary" id="finishBtn" onclick="finishSession()">إنهاء ✅</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/supabase-client.js?v=5"></script>
<script src="js/focus.js?v=5"></script>
</body>
</html>
