<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مِدار — المساعد الذكي</title>
<link rel="stylesheet" href="css/style.css?v=5">
<script src="js/supabase-js.min.js?v=5"></script>
</head>
<body>

<div class="topbar">
  <div>
    <div class="greeting">🤖 مساعد مِدار</div>
    <div class="sub">اسأل عن أي حاجة في مذاكرتك</div>
  </div>
  <div class="icon-btn" onclick="location.href='dashboard.html'">🏠</div>
</div>

<div class="container" id="chatContainer" style="padding-bottom:140px">
  <div id="suggestions" style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px">
    <button class="list-card" style="text-align:right; padding:14px 16px; border:1px solid var(--border); cursor:pointer" onclick="sendSuggestion('اشرحلي أي مفهوم مش فاهمه')">
      <div style="font-weight:700; font-size:13.5px">💡 اشرح مفهوم</div>
      <div style="font-size:12px; color:var(--text-soft); margin-top:2px">اكتب أي درس مش فاهمه وهشرحهولك ببساطة</div>
    </button>
    <button class="list-card" style="text-align:right; padding:14px 16px; border:1px solid var(--border); cursor:pointer" onclick="sendSuggestion('اعمللي 5 أسئلة اختبار سريع في مادة اخترها انا')">
      <div style="font-weight:700; font-size:13.5px">📝 اختبار سريع</div>
      <div style="font-size:12px; color:var(--text-soft); margin-top:2px">5 أسئلة تجريبية في أي مادة</div>
    </button>
    <button class="list-card" style="text-align:right; padding:14px 16px; border:1px solid var(--border); cursor:pointer" onclick="sendSuggestion('لخصلي أهم نقاط المذاكرة الفعالة قبل الامتحان')">
      <div style="font-weight:700; font-size:13.5px">📖 نصايح مذاكرة</div>
      <div style="font-size:12px; color:var(--text-soft); margin-top:2px">طرق مذاكرة ومراجعة فعالة</div>
    </button>
  </div>

  <div id="messages" style="display:flex; flex-direction:column; gap:12px"></div>
</div>

<div style="position:fixed; bottom:0; right:0; left:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--bg-card) 94%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--border)">
  <form id="chatForm" style="display:flex; align-items:center; gap:8px; background:var(--bg-soft); border:1px solid var(--border); border-radius:999px; padding:6px 6px 6px 16px">
    <input id="chatInput" placeholder="اسأل المساعد الذكي عن أي حاجة..." style="flex:1; border:none; background:transparent; outline:none; font-family:var(--font); font-size:14px; color:var(--text)">
    <button type="submit" id="sendBtn" style="width:38px; height:38px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; flex-shrink:0">➤</button>
  </form>
</div>

<div class="bottom-nav">
  <a href="dashboard.html"><span class="ic">🏠</span>الرئيسية</a>
  <a href="schedule.html"><span class="ic">📅</span>الجدول</a>
  <a href="exams.html"><span class="ic">🎯</span>الامتحانات</a>
  <a href="assistant.html" class="active"><span class="ic">🤖</span>مساعد</a>
  <a href="settings.html"><span class="ic">⚙️</span>إعدادات</a>
</div>

<div class="toast" id="toast"></div>

<script src="js/supabase-client.js?v=5"></script>
<script src="js/assistant.js?v=5"></script>
</body>
</html>
