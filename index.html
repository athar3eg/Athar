<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مِدار — العقل الثاني للطالب</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/supabase-js.min.js"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="brand">
    <div class="logo">🧠</div>
    <h1>مِدار</h1>
    <p>العقل الثاني للطالب</p>
  </div>

  <div class="card">
    <div id="errorMsg" class="error-msg"></div>

    <!-- تسجيل الدخول -->
    <form id="loginForm">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" required placeholder="example@mail.com" autocomplete="email">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">دخول</button>
      <div class="switch-link">مالكش حساب؟ <b onclick="showSignup()">إنشاء حساب</b></div>
      <div class="switch-link"><b onclick="showReset()" style="font-size:12.5px">نسيت كلمة المرور؟</b></div>
    </form>

    <!-- إنشاء حساب -->
    <form id="signupForm" style="display:none">
      <div class="field">
        <label>الاسم</label>
        <input type="text" id="signupName" required placeholder="اسمك">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="signupEmail" required placeholder="example@mail.com" autocomplete="email">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="signupPassword" required minlength="6" placeholder="6 أحرف على الأقل" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="signupBtn">إنشاء حساب</button>
      <div class="switch-link">عندك حساب؟ <b onclick="showLogin()">تسجيل الدخول</b></div>
    </form>

    <!-- استعادة كلمة المرور -->
    <form id="resetForm" style="display:none">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="resetEmail" required placeholder="example@mail.com">
      </div>
      <button type="submit" class="btn btn-primary" id="resetBtn">إرسال رابط الاستعادة</button>
      <div class="switch-link"><b onclick="showLogin()">رجوع لتسجيل الدخول</b></div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/supabase-client.js"></script>
<script>
const errorMsg = document.getElementById("errorMsg");
const toast = document.getElementById("toast");

// يمسك أي خطأ غير متوقع بدل ما يسيب الزرار عالق للأبد
window.addEventListener("error", (e) => {
  console.error("Global error:", e.error || e.message);
  resetAllButtons();
  showError("حصل خطأ غير متوقع: " + (e.message || "جرب تاني"));
});
window.addEventListener("unhandledrejection", (e) => {
  console.error("Unhandled rejection:", e.reason);
  resetAllButtons();
  showError("حصل خطأ في الاتصال: " + (e.reason?.message || e.reason || "جرب تاني"));
});

function resetAllButtons() {
  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");
  const resetBtn = document.getElementById("resetBtn");
  if (loginBtn) { loginBtn.disabled = false; loginBtn.textContent = "دخول"; }
  if (signupBtn) { signupBtn.disabled = false; signupBtn.textContent = "إنشاء حساب"; }
  if (resetBtn) { resetBtn.disabled = false; resetBtn.textContent = "إرسال رابط الاستعادة"; }
}

// يحط سقف زمني لأي طلب — لو الاتصال بطيء أوي، يظهر خطأ واضح بدل ما يعلق للأبد
function withTimeout(promise, ms = 15000) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("الاتصال بطيء جدًا — تأكد من الإنترنت وحاول تاني")), ms))
  ]);
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
}
function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = "block";
}
function hideError() { errorMsg.style.display = "none"; }

function showLogin() {
  hideError();
  document.getElementById("loginForm").style.display = "block";
  document.getElementById("signupForm").style.display = "none";
  document.getElementById("resetForm").style.display = "none";
}
function showSignup() {
  hideError();
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("signupForm").style.display = "block";
  document.getElementById("resetForm").style.display = "none";
}
function showReset() {
  hideError();
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("signupForm").style.display = "none";
  document.getElementById("resetForm").style.display = "block";
}

// لو المستخدم داخل بالفعل، وديه على المكان الصح
(async function checkSession() {
  try {
    const { data: { session } } = await withTimeout(sb.auth.getSession(), 8000);
    if (session) {
      const profile = await withTimeout(getMyProfile(session.user.id), 8000);
      window.location.href = (profile && profile.onboarding_completed) ? "dashboard.html" : "onboarding.html";
    }
  } catch (err) {
    console.error("checkSession error:", err);
    // متعلقش الصفحة — سيب المستخدم يدخل بياناته عادي
  }
})();

// تسجيل الدخول
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  hideError();
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "جاري الدخول...";

  try {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email, password }));

    if (error) {
      showError(error.message.includes("Invalid") ? "البريد أو كلمة المرور غلط" : error.message);
      return;
    }

    const profile = await withTimeout(getMyProfile(data.user.id));
    window.location.href = (profile && profile.onboarding_completed) ? "dashboard.html" : "onboarding.html";

  } catch (err) {
    console.error("Login error:", err);
    showError(err.message || "حصل خطأ، حاول تاني");
  } finally {
    btn.disabled = false; btn.textContent = "دخول";
  }
});

// إنشاء حساب
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  hideError();
  const btn = document.getElementById("signupBtn");
  btn.disabled = true; btn.textContent = "جاري الإنشاء...";

  try {
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;

    const { data, error } = await withTimeout(sb.auth.signUp({
      email, password,
      options: { data: { full_name: name } }
    }));

    if (error) {
      showError(error.message.includes("already registered") ? "الإيميل ده مسجل قبل كده" : error.message);
      return;
    }

    // لو الإيميل محتاج تأكيد، هيبقى مفيش session لسه
    if (!data.session) {
      showToast("اتبعتلك رابط تأكيد على إيميلك ✉️");
      showLogin();
      return;
    }

    window.location.href = "onboarding.html";

  } catch (err) {
    console.error("Signup error:", err);
    showError(err.message || "حصل خطأ، حاول تاني");
  } finally {
    btn.disabled = false; btn.textContent = "إنشاء حساب";
  }
});

// استعادة كلمة المرور
document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  hideError();
  const btn = document.getElementById("resetBtn");
  btn.disabled = true; btn.textContent = "جاري الإرسال...";

  try {
    const email = document.getElementById("resetEmail").value.trim();
    const { error } = await withTimeout(sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname.replace("index.html", "") + "reset-password.html"
    }));

    if (error) { showError(error.message); return; }
    showToast("اتبعتلك رابط استعادة كلمة المرور ✉️");
    showLogin();

  } catch (err) {
    console.error("Reset error:", err);
    showError(err.message || "حصل خطأ، حاول تاني");
  } finally {
    btn.disabled = false; btn.textContent = "إرسال رابط الاستعادة";
  }
});
</script>
</body>
</html>
